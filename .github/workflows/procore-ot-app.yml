name: Build Procore OT App

on:
  workflow_dispatch:
  push:
    paths:
      - "procore_ot_app.py"
      - ".github/workflows/procore-ot-app.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the code
        run: python -m py_compile procore_ot_app.py

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Procore OT App
        run: pyinstaller --onefile --noconsole --clean --name "Procore OT App" procore_ot_app.py

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: Procore-OT-App
          path: dist/*.exe
          if-no-files-found: error
